<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anima arrival C — the first Pain</title>
<link rel="stylesheet" href="../../../polish/_kit/kit.css">
<style>
  /* 1600x900 delivery: the kit authors on 1440x810 and scales to 1920; we
     rescale the same stage to 1600 wide so the spec numbers stay literal. */
  body { width: 1600px; height: 900px; }
  .stage { transform: scale(1.1111111); }

  .mk-tag {
    position: absolute; left: 0; top: 0; z-index: 90;
    display: flex; align-items: stretch;
    font-family: 'Chakra Petch', sans-serif; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
  }
  .mk-tag b {
    padding: 9px 16px 10px; background: var(--ig-gold); color: #0b0a12;
    font-size: 15px; letter-spacing: 0.22em;
  }
  .mk-tag span {
    padding: 9px 18px 10px; background: rgba(11,10,18,0.82);
    color: rgba(244,241,232,0.92); font-size: 13px;
  }
  /* deck plating + guard rail, drawn over the approved backdrop plate */
  .mk-deck { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .mk-deck::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background:
      repeating-linear-gradient(97deg, rgba(255,255,255,0.045) 0 2px, rgba(0,0,0,0) 2px 46px),
      linear-gradient(to bottom, rgba(7,6,12,0) 0%, rgba(9,8,14,0.72) 42%, rgba(6,5,10,0.95) 100%);
  }
  .mk-rail { position: absolute; left: -40px; right: -40px; pointer-events: none; }
  .mk-rail i {
    position: absolute; left: 0; right: 0; height: 5px;
    background: linear-gradient(to right, rgba(120,110,95,0.25), rgba(206,186,140,0.62), rgba(120,110,95,0.25));
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .mk-sil { position: absolute; bottom: 0; filter: brightness(0.06) contrast(1.4); }
  .mk-sil img { display: block; height: 100%; width: auto; }
  .mk-haze { position: absolute; inset: 0; pointer-events: none; }
  .mk-boss { position: absolute; pointer-events: none; }
  .mk-boss img { display: block; width: 100%; height: auto; }

  .mk-chain { position: absolute; pointer-events: none; }
  .mk-chain i {
    position: absolute; width: 3px; display: block;
    background: repeating-linear-gradient(to bottom, rgba(226,214,190,0.85) 0 7px, rgba(0,0,0,0) 7px 12px);
    filter: drop-shadow(0 0 5px rgba(180,150,255,0.35));
  }
  .mk-ice {
    position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    background:
      linear-gradient(to top, rgba(6,10,22,0.96) 0%, rgba(10,18,38,0.78) 46%, rgba(20,40,80,0.18) 100%);
  }
  .mk-crack { position: absolute; pointer-events: none; }
  .mk-crack i {
    position: absolute; height: 3px; display: block; transform-origin: 0 50%;
    background: linear-gradient(to right, rgba(190,120,255,0.9), rgba(120,190,255,0.15));
    filter: drop-shadow(0 0 7px rgba(170,110,255,0.75));
  }
  .mk-eye {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,70,1) 0%, rgba(190,30,30,0.75) 40%, rgba(120,20,30,0) 72%);
    filter: blur(1px);
  }
  .mk-pyre { position: absolute; pointer-events: none; }
  .mk-pyre i {
    position: absolute; display: block; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,190,0.95) 0%, rgba(226,178,120,0.35) 55%, rgba(226,178,120,0) 100%);
  }
  .mk-fig { position: absolute; bottom: 0; }
  .mk-fig img { display: block; height: 100%; width: auto; }
  .mk-lock {
    position: absolute; padding: 6px 14px 7px;
    background: rgba(11,10,18,0.86); color: rgba(244,241,232,0.8);
    border-bottom: 2px solid rgba(244,241,232,0.45);
    font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 0.26em; text-transform: uppercase;
    transform: skewX(var(--ig-skew));
  }
  .mk-lock span { display: inline-block; transform: skewX(var(--ig-skew-inverse)); }
  .mk-reticle-dead .ig-reticle__corner { border-color: rgba(200,196,188,0.55); filter: none; }
  .mk-seal { position: absolute; pointer-events: none; }
  .mk-seal i, .mk-seal u {
    position: absolute; display: block; border-radius: 50%;
    border: 2px solid rgba(206,140,255,0.55);
    box-shadow: 0 0 22px rgba(160,90,255,0.35), inset 0 0 26px rgba(120,50,200,0.3);
  }
  .mk-seal u { border-style: dashed; border-color: rgba(255,170,120,0.5); }
  .mk-seal b {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 50%;
    background: linear-gradient(to top, rgba(206,140,255,0.0), rgba(206,140,255,0.55));
    transform-origin: 50% 100%;
  }
  .mk-warn {
    position: absolute; padding: 11px 20px 13px 16px;
    background: rgba(176,42,42,0.92); color: #f6eee6;
    border-left: 5px solid #f4f1e8;
    font-family: 'Chakra Petch', sans-serif; font-weight: 700;
    transform: skewX(var(--ig-skew));
    box-shadow: 0 10px 26px rgba(0,0,0,0.55);
  }
  .mk-warn > * { display: block; transform: skewX(var(--ig-skew-inverse)); }
  .mk-warn__k { font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.85; }
  .mk-warn__v { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 34px; margin-top: 2px; }
  .mk-warn__s { font-family: 'Exo 2', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.04em; margin-top: 4px; }
  .ig-ctb__row--dead { opacity: 0.4; }
  .ig-ctb__row--dead .ig-ctb__name { text-decoration: line-through; }

</style>
</head>
<body>
<div class="stage ig" id="stage">

  <img class="stage__bg" id="bg" src="../renders/backdrop-a.png" alt=""
       style="transform: scale(1.18);
              object-position: 50% 62%;">
  <div class="stage__grade" style="background:
      radial-gradient(48% 52% at 50% 46%, rgba(170,60,255,0.28) 0%, rgba(0,0,0,0) 70%),
      linear-gradient(to bottom, rgba(4,6,16,0.74) 0%, rgba(4,6,16,0.22) 40%, rgba(3,4,12,0.92) 100%);"></div>
  <div class="mk-seal" style="left: 430px; top: 250px; width: 580px; height: 580px;">
    <i style="inset: 0;"></i>
    <u style="inset: 74px;"></u>
    <i style="inset: 158px; border-style: dotted;"></i>
    <b style="transform: rotate(0deg);"></b><b style="transform: rotate(45deg);"></b><b style="transform: rotate(90deg);"></b><b style="transform: rotate(135deg);"></b><b style="transform: rotate(180deg);"></b><b style="transform: rotate(225deg);"></b><b style="transform: rotate(270deg);"></b><b style="transform: rotate(315deg);"></b>
  </div>
  <div class="mk-boss" style="left: 420px; top: 30px; width: 600px;
       filter: drop-shadow(0 20px 44px rgba(0,0,0,0.65)) brightness(0.9) saturate(1.05);">
    <img src="../../../../../public/art/characters/anima/attack.png" alt="">
  </div>
<div class="mk-chain" style="inset:0;"><i style="left:470px; top:0px; height:260px; transform: rotate(4deg);"></i><i style="left:990px; top:0px; height:280px; transform: rotate(-4deg);"></i></div>
  <div class="mk-sil" style="left: 120px; height: 320px; filter: brightness(0.05) contrast(1.5);">
    <img src="../../../../../public/art/characters/tidus/idle.png" alt="">
  </div>
  <div class="mk-warn" style="left: 512px; top: 640px;">
    <span class="mk-warn__k">Charging</span>
    <span class="mk-warn__v">Pain</span>
    <span class="mk-warn__s">One of you. It will not miss.</span>
  </div>
  <div class="ig-banner">
    <span class="ig-banner__name">Anima</span>
    <span class="ig-banner__chip">Pain</span>
  </div>

  <div class="ig-ctb">
    <div class="ig-ctb__row">
      <span class="ig-ctb__name">Anima</span>
      <span class="ig-ctb__tile ig-ctb__tile--enemy ig-ctb__tile--current"><img src="../../../../../public/art/portraits/anima.png" alt=""></span>
    </div>
    <div class="ig-ctb__row">
      <span class="ig-ctb__name">Seymour</span>
      <span class="ig-ctb__tile ig-ctb__tile--enemy"><img src="../../../../../public/art/portraits/seymour.png" alt=""></span>
    </div>
    <div class="ig-ctb__row ig-ctb__row--dead">
      <span class="ig-ctb__name">Guado Guardian</span>
      <span class="ig-ctb__tile ig-ctb__tile--enemy"><span class="ig-ctb__mono">G</span></span>
    </div>
    <div class="ig-ctb__row ig-ctb__row--dead">
      <span class="ig-ctb__name">Guado Guardian</span>
      <span class="ig-ctb__tile ig-ctb__tile--enemy"><span class="ig-ctb__mono">G</span></span>
    </div>
    <div class="ig-ctb__row">
      <span class="ig-ctb__name">Tidus</span>
      <span class="ig-ctb__tile"><img src="../../../../../public/art/portraits/tidus.png" alt=""></span>
    </div>
  </div>

  <div class="ig-stat-list">
    <div class="ig-stat ig-stat--acting" style="box-shadow: 0 0 0 2px #b02a2a, 0 0 24px rgba(176,42,42,0.6);">
      <span class="ig-stat__face"><img src="../../../../../public/art/portraits/tidus.png" alt=""></span>
      <span class="ig-stat__name">Tidus</span>
      <span class="ig-stat__value">1640<small>/2420</small></span>
      <span class="ig-stat__value ig-stat__value--mp">96</span>
      <span class="ig-stat__od"><i style="width: 62%"></i></span>
    </div>
    <div class="ig-stat">
      <span class="ig-stat__face"><img src="../../../../../public/art/portraits/yuna.png" alt=""></span>
      <span class="ig-stat__name">Yuna</span>
      <span class="ig-stat__value">1120<small>/1500</small></span>
      <span class="ig-stat__value ig-stat__value--mp">248</span>
      <span class="ig-stat__od"><i style="width: 100%"></i></span>
    </div>
    <div class="ig-stat">
      <span class="ig-stat__face"><img src="../../../../../public/art/portraits/lulu.png" alt=""></span>
      <span class="ig-stat__name">Lulu</span>
      <span class="ig-stat__value">980<small>/1180</small></span>
      <span class="ig-stat__value ig-stat__value--mp">312</span>
      <span class="ig-stat__od"><i style="width: 44%"></i></span>
    </div>
  </div>
  <div class="ig-hint"><span>The mark is ours, not hers &mdash; an original seal</span></div>
<div class="mk-tag"><b>C</b><span>Anima&rsquo;s arrival &mdash; the first Pain</span></div>
  <div class="ig-vignette"></div>
  <div class="ig-grain"></div>
  <div class="concept-tag">Concept</div>
  
</div>
</body>
</html>

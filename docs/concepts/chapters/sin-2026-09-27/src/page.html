<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sin concepts (rough)</title>
<style>
@font-face { font-family: Chakra; src: url(../../../../../public/fonts/chakra-petch/ChakraPetch-Bold-700.woff2); font-weight: 700; }
@font-face { font-family: Chakra; src: url(../../../../../public/fonts/chakra-petch/ChakraPetch-Medium-500.woff2); font-weight: 500; }
@font-face { font-family: Corm; src: url(../../../../../public/fonts/cormorant-garamond/CormorantGaramond-Variable-wght.woff2); font-weight: 300 700; }
@font-face { font-family: Corm; src: url(../../../../../public/fonts/cormorant-garamond/CormorantGaramond-Italic-Variable-wght.woff2); font-weight: 300 700; font-style: italic; }
@font-face { font-family: Raj; src: url(../../../../../public/fonts/rajdhani/Rajdhani-SemiBold-600.woff2); font-weight: 600; }
@font-face { font-family: Raj; src: url(../../../../../public/fonts/rajdhani/Rajdhani-Bold-700.woff2); font-weight: 700; }
@font-face { font-family: Exo; src: url(../../../../../public/fonts/exo2/Exo2-Variable-wght.woff2); font-weight: 300 800; }
:root { --ink: #0b0a12; --paper: #f4f1e8; --gold: #e3b94a; --blood: #b02a2a; --sky: #7fc6e8; --grey: #9aa0aa; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; }
/* ---------- frames (1600 x 900) ---------- */
#frame { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #111; font-family: Chakra, sans-serif; }
#frame > * { position: absolute; }
.bg { inset: 0; width: 100%; height: 100%; object-fit: cover; }
.svg { inset: 0; width: 1600px; height: 900px; }
.sprite { height: 330px; bottom: 200px; filter: saturate(0.35) brightness(0.9); opacity: 0.95; }
.tag { background: rgba(11,10,18,.86); color: #fff; font: 700 17px Chakra; letter-spacing: .12em; padding: 6px 12px; text-transform: uppercase; }
.rough { left: 0; top: 0; background: #f4f1e8; color: #0b0a12; font: 700 17px Chakra; letter-spacing: .14em; padding: 7px 14px; text-transform: uppercase; }
.rough b { color: var(--blood); }
.gb { font: 700 19px Chakra; fill: #111; letter-spacing: .08em; text-transform: uppercase; }
.gbs { font: 500 15px Chakra; fill: #1c1c1c; letter-spacing: .04em; }
.num { width: 42px; height: 42px; border-radius: 50%; background: var(--gold); color: var(--ink); font: 700 24px Chakra; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--ink); }
.note { background: rgba(11,10,18,.88); color: #fff; font: 500 18px Chakra; padding: 6px 11px; border-left: 4px solid var(--gold); max-width: 360px; line-height: 1.25; }
.note em { color: var(--gold); font-style: normal; }
/* HUD approximations */
.pp { right: 70px; width: 500px; height: 66px; background: rgba(11,10,18,.88); transform: skewX(-8deg); display: flex; align-items: center; padding-left: 26px; color: #fff; border-left: 5px solid #555; }
.pp > span { transform: skewX(8deg); display: inline-block; }
.pp .n { font: italic 600 34px Corm; width: 130px; color: #f3ecd7; }
.pp .hp { font: 700 30px Raj; width: 150px; }
.pp .hp small, .pp .mp small { font-size: 18px; color: #aaa; }
.pp .mp { font: 700 28px Raj; color: var(--sky); width: 100px; }
.pp .tagc { font: 700 13px Chakra; letter-spacing: .1em; color: var(--ink); background: var(--gold); padding: 2px 6px; margin-left: 4px; }
.fc { right: 50px; display: flex; align-items: center; gap: 10px; }
.fc .lbl { background: rgba(11,10,18,.88); color: #fff; font: 700 16px Chakra; letter-spacing: .06em; padding: 5px 10px; }
.fc .pic { width: 52px; height: 52px; object-fit: cover; object-position: 50% 20%; border: 2px solid #eee; background: #666; }
.fc .foe { width: 52px; height: 52px; background: #8a9099; border: 3px solid var(--blood); display: flex; align-items: center; justify-content: center; font: 700 12px Chakra; color: #111; text-align: center; line-height: 1; }
.fc.now .pic { border-color: var(--gold); width: 64px; height: 64px; }
.fc .warn { background: var(--blood); color: #fff; font: 700 14px Chakra; letter-spacing: .08em; padding: 4px 8px; }
.fc .clk { background: var(--gold); color: var(--ink); font: 700 14px Chakra; padding: 4px 8px; }
.cmd { left: 70px; width: 400px; height: 66px; background: var(--gold); transform: skewX(-10deg); color: var(--ink); display: flex; align-items: center; padding-left: 28px; }
.cmd > span { transform: skewX(10deg); font: 700 28px Chakra; letter-spacing: .08em; }
.cmd small { font: 700 15px Chakra; letter-spacing: .04em; margin-left: 16px; display: inline-block; line-height: 1.15; }
.cmd.off { background: rgba(244,241,232,.25); color: #ddd; }
.chip { font: 700 16px Chakra; letter-spacing: .1em; padding: 7px 12px; background: rgba(11,10,18,.84); color: #bbb; text-transform: uppercase; }
.chip.on { background: var(--gold); color: var(--ink); }
.chip.rest { background: var(--paper); color: var(--ink); }
/* ---------- sheet parts (1080 wide) ---------- */
#sheet { width: 1080px; background: var(--ink); color: #ece8dc; font: 400 29px/1.36 Exo, sans-serif; padding: 44px 46px 50px; }
#sheet h1 { font: 700 54px/1.05 Corm; color: #fff; margin-bottom: 10px; }
#sheet h2 { font: 700 44px/1.1 Corm; color: var(--gold); margin: 26px 0 8px; }
#sheet h3 { font: 700 21px Chakra; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; margin: 20px 0 4px; }
#sheet .eyebrow { font: 700 19px Chakra; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
#sheet .lede { color: #cfc9b8; font-size: 27px; }
#sheet img.fr { width: 988px; display: block; margin: 18px 0 8px; border: 2px solid #333; }
#sheet ol, #sheet ul { padding-left: 38px; }
#sheet li { margin: 3px 0; }
#sheet b { color: #fff; }
#sheet .box { border: 2px solid var(--gold); padding: 16px 22px; margin: 22px 0 6px; background: rgba(227,185,74,.07); }
#sheet .row { display: flex; gap: 20px; align-items: flex-start; margin: 16px 0; }
#sheet .row img { width: 400px; border: 2px solid #333; flex: none; }
#sheet .row div { font-size: 26px; line-height: 1.3; }
#sheet .row .t { font: 700 34px/1.05 Corm; color: #fff; margin-bottom: 4px; }
#sheet table { border-collapse: collapse; width: 100%; font-size: 24px; line-height: 1.25; margin-top: 8px; }
#sheet td, #sheet th { border-bottom: 1px solid #3a3730; padding: 7px 6px; vertical-align: top; text-align: left; }
#sheet th { font: 700 17px Chakra; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; }
#sheet .k { color: #9d978a; font-size: 22px; }
#sheet .foot { color: #9d978a; font-size: 21px; margin-top: 20px; }
</style>
</head>
<body>
<script src="frames.js"></script>
<script src="sheets.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pyrefly Reprise — living-portrait video preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0f16; /* the grade-B pause tone this stage borrows */
    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .clip-stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #16202e 0%, #070a10 100%);
  }
  .clip-video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain;
    transition: none; /* opacity is driven from JS, frame-synced to the fade */
  }
  .clip-video.is-hidden { visibility: hidden; }
  .clip-placeholder {
    position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%);
    background: rgba(10, 12, 18, 0.85); color: #f2c94c;
    border: 1px solid rgba(242, 201, 76, 0.4);
    padding: 10px 18px; border-radius: 8px;
    font-size: 15px; letter-spacing: 0.02em;
    max-width: min(70vw, 620px); text-align: center;
    white-space: normal; word-wrap: break-word;
    pointer-events: none;
  }
  .diag-line {
    position: absolute; top: 14px; left: 14px;
    background: rgba(0,0,0,0.6); color: #8be0ff;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    padding: 4px 10px; border-radius: 4px;
  }
  .legend {
    position: absolute; right: 14px; bottom: 14px;
    background: rgba(10, 12, 18, 0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 16px;
    color: #e8e2d0;
    font-size: 13px;
    max-width: 360px;
  }
  .legend-title { font-weight: 600; margin-bottom: 8px; color: #f2c94c; }
  .legend-row { display: flex; gap: 10px; margin: 3px 0; }
  .legend-row kbd {
    background: #1c2430; border: 1px solid #3a4658; border-radius: 4px;
    padding: 1px 6px; font-size: 11px; white-space: nowrap;
  }
  .legend-foot { margin-top: 8px; opacity: 0.65; font-size: 11px; }
  .is-hidden { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { createPlayer } from './player.mjs';
  createPlayer(document.getElementById('root'));
</script>
</body>
</html>

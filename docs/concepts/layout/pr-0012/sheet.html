<body>
<div class="sheet ig ig--ffx2">
  <div class="sheet__head">
    <h1 class="sheet__title">PR-0012 — where does the FFX-2 command help slab go?</h1>
    <div class="sheet__sub">Battle Help Config · 4 options · built off, gated on this pick · nothing built</div>
  </div>
  <div class="grid">
    <figure class="cell recommended">
      <div class="shot"><div class="rec-tag">Recommended</div><img src="a.png" alt=""></div>
      <figcaption><em>A</em>&nbsp; One-line slab at the top of the screen</figcaption>
      <p class="cell__note">Full-width band above the field, FFX-2's own canon spot for Battle Help. Clears the command window and the party rows completely; costs a thin strip of the top of the frame at all times.</p>
    </figure>
    <figure class="cell">
      <img src="b.png" alt="">
      <figcaption><em>B</em>&nbsp; Inside the command window, under the rows</figcaption>
      <p class="cell__note">This is the placement 100abe95 shipped and 194fa87 switched off: the slab lands on the party HP/MP rows (dashed box), which anchor `bottom:10px..100px` in the same corner. No repositioning clears both without moving one of the two.</p>
    </figure>
    <figure class="cell">
      <img src="c.png" alt="">
      <figcaption><em>C</em>&nbsp; Tooltip beside the highlighted row</figcaption>
      <p class="cell__note">Floats left of the cascade at the row's height, clear of the party column. Costs battlefield real estate over whatever stands there — here it sits over Bahamut's body, which will vary by encounter and camera.</p>
    </figure>
    <figure class="cell">
      <img src="d.png" alt="">
      <figcaption><em>D</em>&nbsp; Keep it off</figcaption>
      <p class="cell__note">Today's shipped state. commandHelp.ts's description logic is correct and unused; the player still gets no read on what a highlighted row does.</p>
    </figure>
  </div>
  <div class="concept-tag">Concept</div>
</div>

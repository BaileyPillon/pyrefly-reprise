.x2 .card{border-left:0;border-right:calc(3px*var(--f)) solid var(--pink)}

.x2 .card h4{color:var(--pink)}
.card h4 i{font-style:normal;background:var(--harm);color:#fff;padding:calc(2px*var(--f)) calc(6px*var(--f))}
.card b{color:#fff}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C2 — after the briefing, one whisper on first use only</title>
<link rel="stylesheet" href="../../polish/_kit/kit.css">
<link rel="stylesheet" href="../_ob.css">
<style>
  .ob-voice {
    position: absolute; left: 14px; top: -24px;
    font-family: var(--ig-font-display); font-weight: 700; font-size: 11px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--ig-accent);
  }
  .ob-quote .ob-mark__body { font-family: var(--ig-font-serif); font-style: italic; font-size: 21px; }
</style>
</head>
<body>
<div class="stage ig" id="stage">
  <img class="stage__bg" id="bg" src="../../polish/_kit/before/ch1-command-menu.png" alt="">

  <!-- No dim, no numbered course. The briefing already said the rule; this is
       one line in Auron's voice the first time the situation is real. FFX holds
       the turn because FFX's engine holds it anyway. -->
  <div class="ob-mark ob-mark--ink ob-mark--small ob-quote" style="left: 452px; top: 108px; width: 330px;">
    <div class="ob-voice">Auron</div>
    <div class="ob-mark__body">
      &ldquo;He moves after you. Not before. Use it.&rdquo;
    </div>
    <div class="ob-mark__foot"><span><b>Enter</b> continue</span><span>First time only</span></div>
  </div>

  <div class="ig-hint"><span><b>Enter</b> confirm</span><span><b>Esc</b> cancel</span><span><b>P</b> briefing</span></div>

  <div class="ig-vignette"></div>
  <div class="ig-grain"></div>
  <div class="ob-slate">C2 &middot; FFX &middot; first use of turn order &middot; one line, one key</div>
  <div class="concept-tag">Concept</div>
</div>
</body>
</html>

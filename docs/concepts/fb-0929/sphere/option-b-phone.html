<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sphere Grid option B phone</title>
<link rel="stylesheet" href="./mock.css" />
<style>
  .frame { background: #0b0a12; }
  .top { left: 16px; top: 18px; right: 16px; display: flex; justify-content: space-between; font-family: var(--ig-font-display); font-weight: 700; letter-spacing: 0.3em; font-size: 14px; color: var(--ig-gold); }
  .top span:last-child { color: #d8d4c8; }
  .tabs { left: 16px; top: 50px; display: flex; gap: 20px; font-family: var(--ig-font-display); font-weight: 700; letter-spacing: 0.2em; font-size: 13px; color: #8c8a93; white-space: nowrap; }
  .tabs .on { color: #f4f1e8; border-bottom: 3px solid var(--ig-gold); padding-bottom: 7px; }
  .faces { left: 16px; top: 88px; display: flex; gap: 6px; }
  .faces div { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid #3a4456; position: relative; background: #141222; }
  .faces div.sel { border-color: var(--ig-gold); box-shadow: 0 0 0 3px rgba(227, 185, 74, 0.35); }
  .faces img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; }
  .who { left: 16px; top: 144px; right: 16px; display: flex; align-items: baseline; gap: 10px; }
  .who .n { font-family: var(--ig-font-serif); font-style: italic; font-size: 28px; color: #f4f1e8; }
  .who .s { font-family: var(--ig-font-display); font-weight: 700; color: var(--ig-gold); font-size: 13px; letter-spacing: 0.14em; }
  .who .s b { font-family: var(--ig-font-numeral); font-size: 22px; color: #f4f1e8; }
  .gridbox { left: 16px; top: 184px; width: 358px; height: 330px; background: url('./assets/grid-tall.jpg') 0 -30px / 358px auto no-repeat; outline: 2px solid rgba(227, 185, 74, 0.55); overflow: hidden; }
  svg.over { position: absolute; left: 16px; top: 184px; width: 358px; height: 330px; }
  .btns { left: 16px; top: 522px; width: 358px; display: grid; grid-template-columns: 1.3fr 1fr 1fr 1.5fr 1fr; gap: 6px; }
  .btns span { height: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--ig-font-display); font-weight: 700; letter-spacing: 0.14em; font-size: 14px; color: #f4f1e8; border: 2px solid rgba(244, 241, 232, 0.7); }
  .card { left: 22px; top: 580px; width: 346px; height: 118px; padding: 12px 14px 10px 20px; }
  .card .t { font-family: var(--ig-font-serif); font-style: italic; font-weight: 600; font-size: 22px; }
  .card .b { font-family: var(--ig-font-numeral); font-weight: 700; font-size: 26px; }
  .card .b em { font-style: normal; color: var(--ig-gold-on-paper); }
  .card .r { font-family: var(--ig-font-text); font-size: 13.5px; color: #2a2733; }
  .pouch { left: 16px; top: 708px; width: 358px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .pouch .chip { color: #f4f1e8; font-size: 12.5px; }
  .pouch .chip b { font-family: var(--ig-font-numeral); font-size: 16px; color: var(--ig-gold); }
  .start { left: 8px; right: 8px; bottom: 14px; height: 50px; background: var(--ig-gold); transform: skewX(-12deg); font-family: var(--ig-font-display); font-weight: 700; letter-spacing: 0.3em; font-size: 18px; color: var(--ig-ink); display: flex; align-items: center; justify-content: center; }
  .start > span { transform: skewX(12deg); }
  .option-label { left: 16px; bottom: 70px; font-size: 10px; letter-spacing: 0.2em; }
</style>
</head>
<body>
<div class="ig frame frame--phone">
  <div class="abs top"><span>&mdash; PARTY PREP</span><span>FFX &middot; I</span></div>
  <div class="abs tabs"><span>CHAPTER</span><span>STATS</span><span class="on">SPHERE GRID</span><span>EQUIP</span></div>
  <div class="abs faces">
    <div class="sel"><img src="/art/portraits/tidus.png" alt="" /></div><div><img src="/art/portraits/yuna.png" alt="" /></div>
    <div><img src="/art/portraits/kimahri.png" alt="" /></div><div><img src="/art/portraits/auron.png" alt="" /></div>
    <div><img src="/art/portraits/wakka.png" alt="" /></div><div><img src="/art/portraits/lulu.png" alt="" /></div>
    <div><img src="/art/portraits/rikku.png" alt="" /></div>
  </div>
  <div class="abs who"><span class="n">Tidus</span><span class="s">S.LV <b>30</b> &rarr; <b style="color:#f2c21e">28</b></span></div>
  <div class="abs gridbox"></div>
  <svg class="over" viewBox="0 0 358 330">
    <polyline points="97,121 98,168 25,197" fill="none" stroke="#fff0a8" stroke-width="3" stroke-dasharray="7 5" />
    <circle cx="25" cy="197" r="17" fill="none" stroke="#f2c21e" stroke-width="3" />
    <rect x="48" y="210" width="70" height="22" fill="#f2c21e" /><text x="55" y="226" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="13" fill="#0b0a12">+2 STR</text>
  </svg>
  <div class="abs btns"><span>WALK</span><span>&minus;</span><span>+</span><span>CENTRE</span><span>?</span></div>
  <div class="slab card"><div class="in">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="t">Strength +2</span><span class="b">STR 31 <em>&rarr; 33</em></span></div>
    <div class="r">Power Sphere &middot; 12 held &middot; 2 steps, 2 S.Lv</div>
    <div style="margin-top:8px"><span class="btn btn--dark" style="font-size:12px;padding:8px 12px">Tap again: walk and activate</span></div>
  </div></div>
  <div class="abs pouch">
    <span class="chip"><i class="dot" style="background:#f28a6a"></i>Power <b>12</b></span><span class="chip"><i class="dot" style="background:#f2d24a"></i>Speed <b>8</b></span>
    <span class="chip"><i class="dot" style="background:#b48fe0"></i>Mana <b>8</b></span><span class="chip"><i class="dot" style="background:#f2c21e"></i>Ability <b>4</b></span>
    <span class="chip"><i class="dot" style="background:#e0585e"></i>Keys <b>4&middot;2&middot;1&middot;1</b></span>
  </div>
  <div class="abs start"><span>&#9654; START BATTLE</span></div>
</div>
</body>
</html>

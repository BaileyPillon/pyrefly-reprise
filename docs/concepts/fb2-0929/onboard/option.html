<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-run options</title>
<!-- The game's own tokens and fonts; the frames are our own captures of the live build. -->
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="../../../../src/ui/inkgold/tokens.css">
<link rel="stylesheet" href="_mock.css">
<style>
  /* before: numbered stall markers */
  .pin { position: absolute; width: 34px; height: 34px; border-radius: 50%;
    background: var(--ig-blood); color: var(--ig-paper); display: grid; place-items: center;
    font-family: var(--ig-font-display); font-weight: 700; font-size: 18px;
    box-shadow: 0 0 0 3px rgba(244,241,232,.85), 0 6px 16px rgba(0,0,0,.6); z-index: 60; }
  .note { position: absolute; z-index: 60; background: rgba(11,10,18,.92); color: var(--ig-paper);
    border-left: 4px solid var(--ig-blood); padding: 10px 14px; font-size: 16px; line-height: 1.35; max-width: 330px; }
  .note b { color: #ffb3a8; font-family: var(--ig-font-display); letter-spacing: .12em; text-transform: uppercase; font-size: 13px; display: block; margin-bottom: 3px; }
  .phone .pin { width: 26px; height: 26px; font-size: 14px; }
  .phone .note { font-size: 12.5px; padding: 7px 10px; max-width: 250px; }
  .phone .note b { font-size: 10.5px; }
</style>
</head>
<body>
<div class="stage ig" id="stage"></div>
<script>
// ?o=before|o1|o2|o3  &step=1..3  &w=390   -- one page draws every frame of the round.
const q = new URLSearchParams(location.search);
const o = q.get('o') || 'before';
const step = Number(q.get('step') || 1);
const phone = q.get('w') === '390';
if (phone) document.body.classList.add('phone');
const S = document.getElementById('stage');
const sz = phone ? '390' : '1600';
const frame = (name) => { S.style.backgroundImage = `url(frames/${name}-${sz}.jpg)`; };
const add = (html) => { S.insertAdjacentHTML('beforeend', html); };
const px = (d, p) => (phone ? p : d);
const slate = (t) => add(`<div class="slate">${t}</div>`);

// Anchors measured on the live build (docs/handoff/fb2-0929-onboard.md, the walk).
const A = {
  plate: phone ? [12, 34, 367, 139] : [64, 133, 778, 407],
  start: phone ? [7, 782, 376, 46] : [1233, 642, 307, 61],
  attack: phone ? [199, 610, 183, 55] : [88, 513, 390, 57],
};
const box = ([x, y, w, h], cls, pad = 0) => `<div class="${cls}" style="left:${x - pad}px;top:${y - pad}px;width:${w + 2 * pad}px;height:${h + 2 * pad}px"></div>`;

if (o === 'before') {
  const which = q.get('f') || 'board'; // board | battleline
  frame(which);
  if (which === 'board') {
    if (phone) {
      add(`<div class="pin" style="left:326px;top:58px">1</div>`);
      add(`<div class="note" style="left:54px;top:410px;max-width:300px"><b>1 · 2 · 3</b>Nothing says which card to start with; eighteen cards read alike. The only way in is "tap the plate", and nothing says the plate is the picture at the top. There is no button.</div>`);
      add(`<div class="pin" style="left:14px;top:430px">2</div>`);
      add(`<div class="pin" style="left:12px;top:782px">3</div>`);
    } else {
      add(`<div class="pin" style="left:810px;top:118px">1</div>`);
      add(`<div class="note" style="left:470px;top:170px"><b>1 · No start</b>The picture IS the start button. Nothing on it says so, and it looks like art.</div>`);
      add(`<div class="pin" style="left:1210px;top:140px">2</div>`);
      add(`<div class="note" style="left:1250px;top:190px"><b>2 · 18 equal cards</b>Every fight reads the same; no "start here".</div>`);
      add(`<div class="pin" style="left:820px;top:830px">3</div>`);
      add(`<div class="note" style="left:1210px;top:760px"><b>3 · The only instruction</b>"Click the plate begin", in small type at the foot.</div>`);
    }
    slate('Before · today, after the briefing');
  } else {
    if (phone) {
      add(`<div class="pin" style="left:14px;top:132px">1</div>`);
      add(`<div class="note" style="left:60px;top:300px"><b>1 · Key-only</b>"Enter continue" on a phone. The line also covers the boss.</div>`);
      add(`<div class="pin" style="left:12px;top:560px">2</div>`);
      add(`<div class="note" style="left:60px;top:548px"><b>2 · Two advisors</b>The chip and the guide name different moves.</div>`);
    } else {
      add(`<div class="pin" style="left:582px;top:730px">1</div>`);
      add(`<div class="note" style="left:1010px;top:560px"><b>1 · Enter continue</b>A mouse player does not know a click on the line works. Clicking ATTACK instead kept the line up into targeting.</div>`);
      add(`<div class="pin" style="left:30px;top:100px">2</div>`);
      add(`<div class="pin" style="left:520px;top:70px">2</div>`);
      add(`<div class="note" style="left:760px;top:40px"><b>2 · Two different "next"</b>The guide says Holy Water → Yuna, the move chip says Slow → Seymour Flux.</div>`);
    }
    slate('Before · today, the first command');
  }
}

if (o === 'o1') {
  frame('board');
  add(box(A.plate, 'spot'));
  if (phone) {
    add(`<div class="paper" style="left:22px;top:196px;width:330px;padding:16px 18px 18px 20px"><div class="in">
      <div class="eyebrow" style="font-size:11px">Start here · Chapter I</div>
      <div class="title" style="font-size:30px;margin:6px 0 10px">Your first fight</div>
      <div class="plan" style="font-size:12px"><b>Choose a fight</b><i>→</i><b>pick your party</b><i>→</i><b>win</b></div>
      <div class="body" style="font-size:14px;margin-top:10px;color:#2a2733">Seymour Flux, on Mt. Gagazet. Your party is already set.</div>
    </div></div>`);
    add(`<div class="ghost" style="position:absolute;left:18px;top:690px;font-size:11px;width:330px;line-height:1.5;background:rgba(11,10,18,.94);padding:8px 12px">The other fights <b>stay open</b>. The board lights up after your first battle.</div>`);
    add(`<div class="go" style="position:absolute;left:18px;top:760px;width:354px;height:62px;justify-content:center;font-size:17px"><span class="tri"></span><span>Start Chapter I</span></div>`);
  } else {
    add(`<div class="paper" style="left:70px;top:585px;width:760px;padding:22px 30px 26px 32px"><div class="in">
      <div class="eyebrow">Start here · Chapter I</div>
      <div class="plan" style="font-size:18px;margin:12px 0 18px"><b>Choose a fight</b><i>→</i><b>pick your party</b><i>→</i><b>win</b></div>
      <div class="go" style="height:66px;padding:0 34px;font-size:22px"><span class="tri"></span><span>Start Chapter I</span></div>
      <span class="ghost" style="font-size:13px;margin-left:26px;color:#5b5666"><b style="color:var(--ig-gold-on-paper)">Enter</b> or click</span>
    </div></div>`);
    add(`<div class="ghost" style="position:absolute;left:880px;top:800px;font-size:14px;width:640px;line-height:1.5">The other fights <b>stay open</b>: click any card. The board lights up after your first battle.</div>`);
  }
  slate('O1 · One clear next step');
}

if (o === 'o2') {
  const n = step;
  const steps = `<div class="steps" style="margin-top:12px">${[1, 2, 3].map((i) => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>`;
  const line = (x, y, w, lead, text, extra = '') => add(`<div class="ink" style="left:${x}px;top:${y}px;width:${w}px;padding:${px('16px 24px 16px 22px', '12px 16px 12px 16px')}"><div class="in">
      <div class="eyebrow" style="font-size:${px(13, 11)}px">Auron · ${n} of 3</div>
      <div class="title" style="font-size:${px(27, 21)}px;margin:${px('8px 0 6px', '6px 0 4px')};color:var(--ig-paper)">${lead}</div>
      <div class="body" style="font-size:${px(17, 13.5)}px;color:rgba(244,241,232,.86)">${text}</div>${extra}${steps}
      <div class="ghost" style="font-size:${px(12, 10)}px;margin-top:10px"><b>${phone ? 'Tap here' : 'Esc'}</b> skip the guide</div>
    </div></div>`);
  if (n === 1) {
    frame('board');
    add(box(A.plate, 'spot spot--pulse'));
    if (phone) {
      add(`<div class="chev chev--up" style="left:176px;top:186px"></div>`);
      line(22, 222, 330, '“Start with the first one.”', 'Tap its picture to begin. The other fights wait on the board.');
    } else {
      add(`<div class="chev chev--left" style="left:866px;top:318px"></div>`);
      line(900, 250, 420, '“Start with the first one.”', 'Click its picture to begin. The others wait on the board.');
    }
  } else if (n === 2) {
    frame('prep');
    add(box(A.start, 'spot spot--pulse'));
    if (phone) {
      add(`<div class="chev" style="left:176px;top:742px"></div>`);
      line(22, 520, 330, '“Your party is ready.”', 'Tabs are for later. Tap START BATTLE.');
    } else {
      add(`<div class="chev chev--right" style="left:1196px;top:655px"></div>`);
      line(650, 590, 520, '“Your party is ready.”', 'The tabs are for later. Start the battle.');
    }
  } else {
    frame('battle');
    add(box(A.attack, 'ring', 6));
    const extra = `<div class="body" style="font-size:${px(16, 13)}px;margin-top:${px(10, 7)}px;color:var(--ig-gold)">${phone ? 'Tap ATTACK, then tap who it hits.' : 'Pick ATTACK, then pick who it hits.'}</div>`;
    if (phone) {
      add(`<div class="chev" style="left:272px;top:582px"></div>`);
      line(22, 150, 330, '“He moves after you. Not before. Use it.”', 'Your turn.', extra);
    } else {
      add(`<div class="chev chev--left" style="left:494px;top:524px"></div>`);
      line(540, 400, 440, '“He moves after you. Not before. Use it.”', 'Your turn.', extra);
    }
  }
  slate(`O2 · Guided first run · step ${n} of 3`);
}

if (o === 'o3') {
  if (step === 1) {
    frame('battle');
    const card = (x, y, w) => add(`<div class="paper" style="left:${x}px;top:${y}px;width:${w}px;padding:${px('20px 30px 22px 30px', '14px 16px 16px 18px')}"><div class="in">
      <div class="eyebrow" style="font-size:${px(13, 10.5)}px">First fight · Chapter I · Seymour Flux</div>
      <div class="body" style="font-size:${px(21, 15)}px;margin-top:${px(10, 8)}px;color:var(--ig-ink)"><b>${phone ? 'Tap' : 'Pick'} a command</b>, then ${phone ? 'tap' : 'pick'} who it hits.</div>
      <div class="body" style="font-size:${px(21, 15)}px;margin-top:4px;color:var(--ig-ink)"><b>Nothing moves until you act.</b> ${phone ? 'The faces at the top show' : 'The column on the right shows'} who goes next.</div>
      <div class="go" style="margin-top:${px(16, 12)}px;height:${px(46, 40)}px;padding:0 ${px(26, 20)}px;font-size:${px(16, 13)}px"><span>Got it</span></div>
    </div></div>`);
    if (phone) card(18, 150, 336); else card(560, 120, 640);
    slate('O3 · Straight into the fight · the primer');
  } else {
    frame('board');
    add(box(A.plate, 'spot'));
    if (phone) {
      add(`<div class="ink" style="left:22px;top:196px;width:330px;padding:14px 16px 16px 18px"><div class="in">
        <div class="eyebrow" style="font-size:11px">This is the board</div>
        <div class="body" style="font-size:14px;margin-top:8px">Every boss fight here, FFX and FFX-2, is open. The picture at the top starts the one you picked.</div>
        <div class="go" style="margin-top:12px;height:40px;padding:0 18px;font-size:13px"><span>Got it</span></div>
      </div></div>`);
    } else {
      add(`<div class="ink" style="left:880px;top:240px;width:470px;padding:20px 26px 22px 24px"><div class="in">
        <div class="eyebrow">This is the board</div>
        <div class="body" style="font-size:19px;margin-top:10px">Every boss fight here, FFX and FFX-2, is open. Click a card to look; click the picture to start it.</div>
        <div class="go" style="margin-top:16px;height:44px;padding:0 24px;font-size:15px"><span>Got it</span></div>
      </div></div>`);
      add(`<div class="chev chev--left" style="left:848px;top:318px"></div>`);
    }
    slate('O3 · after the first result · the board card');
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="eint-mock.css">
<style>
  html,body{margin:0;padding:0;}
  .stage{position:relative;width:900px;height:560px;background:#050810 url('bg-crop.jpg') center/cover no-repeat;overflow:hidden;font-family:sans-serif;}
  .eint-mock{left:40px;top:24px;}
</style>
</head>
<body>
<div class="stage">
  <div class="eint-mock">
    <p class="eint-mock__enemy"><span>Seymour Flux</span><i>acts next</i></p>
    <p class="eint-mock__move">
      <span class="eint-mock__label">Lance of Atrophy</span>
      <span class="eint-mock__conf">Scripted</span>
      <span class="eint-mock__pair-badge">No window</span>
    </p>
    <p class="eint-mock__desc">Physical non-elemental damage to one character &mdash; never misses.</p>
    <h4 class="eint-mock__head">Statuses</h4>
    <ul class="eint-mock__lines">
      <li>Zombie 100%</li>
    </ul>
    <h4 class="eint-mock__head">Damage</h4>
    <ul class="eint-mock__dmgs">
      <li class="eint-mock__dmg">
        <span class="eint-mock__who">Yuna</span>
        <span class="eint-mock__amt">707&ndash;799</span>
        <span class="eint-mock__pct">31% HP</span>
      </li>
    </ul>
    <h4 class="eint-mock__head">If you attack</h4>
    <ul class="eint-mock__lines">
      <li>A Delay attempt is punished with party-wide Slowga</li>
    </ul>
  </div>
  <div style="position:absolute;left:14px;bottom:10px;color:#f4f1e8cc;font:700 12px 'Chakra Petch',sans-serif;letter-spacing:.2em;">OPTION B &middot; SECOND BADGE</div>
</div>
</body>
</html>

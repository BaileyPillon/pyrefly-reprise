<!doctype html>
<html>

  <style>
    body { margin: 0; background: #0B0A12; }
    a { color: #E3B94A; } a:hover { color: #F4F1E8; }

    .cmd > * { transform: skewX(12deg); }
    .cmd.sel { background: #E3B94A; }
    .cmd small { margin-left: auto; font-size: 12px; letter-spacing: 0.22em; font-weight: 700; }
  </style>
</helmet>
<div class="frame">

  </div>

  <div style="position: absolute; left: 720px; top: 590px; width: 420px; padding: 18px 22px; background: rgba(11, 10, 18, 0.82); border-left: 4px solid #E3B94A; transform: skewX(-12deg);">
    <div style="transform: skewX(12deg);">

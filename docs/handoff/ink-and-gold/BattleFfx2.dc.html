<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Rajdhani:wght@600;700&display=swap">
  <style>
    body { margin: 0; background: #0B0A12; }
    a { color: #F7B6D9; } a:hover { color: #F4F1E8; }
    .frame { position: relative; width: 1440px; height: 810px; overflow: hidden; background: #0B0A12; font-family: 'Chakra Petch', 'Bahnschrift', 'Segoe UI', sans-serif; color: #F4F1E8; }
    .serif { font-family: 'Cormorant Garamond', 'Georgia', serif; }
    .num { font-family: 'Rajdhani', 'Bahnschrift', sans-serif; }
    .cmd { display: flex; align-items: center; gap: 14px; width: 292px; height: 52px; padding: 0 24px 0 22px; background: #F4F1E8; color: #0B0A12; font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; transform: skewX(12deg); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); }
    .cmd span { display: inline-block; transform: skewX(-12deg); }
    .cmd.sel { background: #F7B6D9; }
    .stat { display: flex; align-items: center; gap: 16px; width: 470px; height: 62px; padding-right: 18px; background: rgba(11, 10, 18, 0.84); border-right: 6px solid #F4F1E8; transform: skewX(12deg); }
    .stat > * { transform: skewX(-12deg); }
    .stat.acting { border-right-color: #F7B6D9; background: rgba(11, 10, 18, 0.94); }
    .sphere { position: relative; width: 50px; height: 50px; margin-left: 12px; border: 2px solid #F4F1E8; background: #0B0A12; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex: none; }
    .stat.acting .sphere { border-color: #F7B6D9; color: #F7B6D9; }
    .name { width: 90px; font-size: 24px; font-weight: 700; font-style: italic; }
    .val { display: flex; align-items: baseline; gap: 3px; font-weight: 700; font-size: 26px; line-height: 1; }
    .val small { font-size: 13px; color: #9fb0c4; font-weight: 600; }
    .val.mp { color: #7FC6E8; }
    .atb { position: relative; width: 110px; height: 8px; background: #2a3246; margin-left: auto; }
    .atb i { position: absolute; inset: 0 auto 0 0; display: block; background: #F7B6D9; }
    .corner { position: absolute; width: 30px; height: 30px; border: 0 solid #F7B6D9; filter: drop-shadow(0 0 4px rgba(247, 182, 217, 0.6)); }
  </style>
</helmet>
<div class="frame">
  <img src="bg-bevelle-underground.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; object-fit: cover; filter: saturate(0.95) contrast(1.06);">
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 45% 40%, rgba(11, 10, 18, 0) 45%, rgba(11, 10, 18, 0.55) 100%), linear-gradient(180deg, rgba(11, 10, 18, 0.35) 0%, rgba(11, 10, 18, 0) 22%, rgba(11, 10, 18, 0) 68%, rgba(11, 10, 18, 0.62) 100%);"></div>

  <img src="char-bahamut.webp" alt="" style="position: absolute; left: 40px; top: 70px; height: 600px; filter: drop-shadow(0 0 30px rgba(247, 182, 217, 0.3));">
  <img src="char-paine-warrior.webp" alt="" style="position: absolute; left: 896px; top: 350px; height: 300px; filter: brightness(0.82);">
  <img src="char-rikku-thief.webp" alt="" style="position: absolute; left: 790px; top: 330px; height: 320px; filter: brightness(0.86);">
  <img src="char-yuna-gunner.webp" alt="" style="position: absolute; left: 650px; top: 280px; height: 380px; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.5));">

  <svg style="position: absolute; inset: 0; width: 1440px; height: 810px; opacity: 0.13; mix-blend-mode: overlay; pointer-events: none;" xmlns="http://www.w3.org/2000/svg"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

  <div style="position: absolute; left: 40px; top: 70px; width: 560px; height: 660px;">
    <div class="corner" style="left: 0; top: 0; border-left-width: 3px; border-top-width: 3px;"></div>
    <div class="corner" style="right: 0; top: 0; border-right-width: 3px; border-top-width: 3px;"></div>
    <div class="corner" style="left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px;"></div>
    <div class="corner" style="right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px;"></div>
    <div style="position: absolute; right: -18px; top: 300px; transform: skewX(12deg); padding: 7px 20px 8px; background: #0B0A12; border-right: 4px solid #F7B6D9; white-space: nowrap;">
      <span class="serif" style="display: inline-block; transform: skewX(-12deg); font-size: 24px; font-weight: 700; letter-spacing: 0.08em;">BAHAMUT</span>
    </div>
  </div>

  <div style="position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 14px;">
    <div class="serif" style="font-size: 26px; font-weight: 700; font-style: italic;">Bahamut</div>
    <div style="position: relative; width: 300px; height: 8px; background: rgba(11, 10, 18, 0.7);"><div style="position: absolute; inset: 0 auto 0 0; width: 68%; background: #F7B6D9;"></div></div>
  </div>

  <div style="position: absolute; left: 420px; top: 80px;">
    <svg width="380" height="190" viewBox="0 0 380 190" style="position: absolute; left: -46px; top: -34px;" xmlns="http://www.w3.org/2000/svg"><path d="M18 96 L58 34 L142 54 L206 8 L266 62 L352 42 L326 112 L364 166 L252 146 L182 182 L118 136 L36 158 Z" fill="#F7B6D9" opacity="0.94"></path></svg>
    <div class="serif" style="position: relative; font-size: 128px; font-weight: 700; font-style: italic; color: #0B0A12; line-height: 1; letter-spacing: -0.02em;">742</div>
    <div style="position: absolute; left: 250px; top: 110px; padding: 6px 14px; background: #0B0A12; color: #F7B6D9; font-size: 16px; font-weight: 700; letter-spacing: 0.2em; transform: rotate(-8deg); white-space: nowrap;">CHAIN ×4</div>
  </div>

  <div style="position: absolute; right: 48px; top: 40px; display: flex; align-items: center; gap: 18px; padding: 10px 28px 12px 34px; background: #F4F1E8; border-bottom: 4px solid #F7B6D9; transform: skewX(12deg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
    <div style="transform: skewX(-12deg); padding: 7px 12px; background: #0B0A12; color: #F7B6D9; font-weight: 700; font-size: 14px; letter-spacing: 0.26em;">TRIGGER HAPPY</div>
    <div class="serif" style="transform: skewX(-12deg); font-size: 46px; font-weight: 700; font-style: italic; color: #0B0A12; line-height: 1;">Yuna</div>
  </div>

  <div style="position: absolute; right: 40px; bottom: 262px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
    <div class="cmd sel" style="margin-right: 0;"><span>Attack</span><svg width="12" height="16" viewBox="0 0 12 16" style="transform: skewX(-12deg); margin-left: auto;" xmlns="http://www.w3.org/2000/svg"><path d="M11 1 L1 8 L11 15 Z" fill="#0B0A12"></path></svg></div>
    <div class="cmd" style="margin-right: 16px;"><span>Trigger Happy</span></div>
    <div class="cmd" style="margin-right: 32px;"><span>Items</span></div>
    <div class="cmd" style="margin-right: 48px; background: #0B0A12; color: #F7B6D9; border: 2px solid #F7B6D9;"><span>Spherechange</span></div>
  </div>

  <div style="position: absolute; left: 52px; bottom: 54px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
    <div class="stat acting"><div class="sphere">G</div><div class="name serif" style="color: #F7B6D9;">Yuna</div><div class="val num">1240<small>/1980</small></div><div class="val num mp">140<small>/200</small></div><div class="atb"><i style="width: 100%;"></i></div></div>
    <div class="stat" style="margin-left: 16px;"><div class="sphere">T</div><div class="name serif">Rikku</div><div class="val num">980<small>/1400</small></div><div class="val num mp">140<small>/200</small></div><div class="atb"><i style="width: 72%;"></i></div></div>
    <div class="stat" style="margin-left: 32px;"><div class="sphere">W</div><div class="name serif">Paine</div><div class="val num">1600<small>/2100</small></div><div class="val num mp">140<small>/200</small></div><div class="atb"><i style="width: 41%;"></i></div></div>
  </div>
</div>
</x-dc>
</body>
</html>

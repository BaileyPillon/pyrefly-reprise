<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Rajdhani:wght@600;700&display=swap">
  <style>
    body { margin: 0; background: #0B0A12; }
    a { color: #E3B94A; } a:hover { color: #F4F1E8; }
    .frame { position: relative; width: 1440px; height: 810px; overflow: hidden; background: #0B0A12; font-family: 'Chakra Petch', 'Bahnschrift', 'Segoe UI', sans-serif; color: #F4F1E8; }
    .serif { font-family: 'Cormorant Garamond', 'Georgia', serif; }
    .num { font-family: 'Rajdhani', 'Bahnschrift', sans-serif; }
    .cmd { display: flex; align-items: center; gap: 14px; width: 292px; height: 52px; padding: 0 22px 0 24px; background: #F4F1E8; color: #0B0A12; font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; transform: skewX(-12deg); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); }
    .cmd span { display: inline-block; transform: skewX(12deg); }
    .cmd.sel { background: #E3B94A; }
    .cmd.dim { opacity: 0.42; }
    .ctb { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .ctb b { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: #F4F1E8; text-shadow: 0 1px 2px #0B0A12; padding: 3px 8px; background: rgba(11, 10, 18, 0.62); }
    .tile { position: relative; width: 46px; height: 46px; border: 2px solid #F4F1E8; background: #0B0A12; overflow: hidden; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.55); flex: none; }
    .tile img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; display: block; }
    .tile.enemy { border-color: #B02A2A; background: #2a0f12; }
    .tile.now { width: 64px; height: 64px; border: 3px solid #E3B94A; box-shadow: 0 0 0 2px #0B0A12, 0 0 20px rgba(227, 185, 74, 0.6); }
    .tag { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; color: #F4F1E8; text-shadow: 1px 1px 0 #0B0A12; }
    .mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: rgba(244, 241, 232, 0.8); }
    .stat { display: flex; align-items: center; gap: 16px; width: 450px; height: 62px; padding-right: 18px; background: rgba(11, 10, 18, 0.84); border-left: 6px solid #F4F1E8; transform: skewX(-12deg); }
    .stat > * { transform: skewX(12deg); }
    .stat.acting { border-left-color: #E3B94A; background: rgba(11, 10, 18, 0.94); }
    .face { width: 62px; height: 62px; overflow: hidden; background: #1A1526; flex: none; margin-left: 6px; }
    .face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; }
    .name { width: 96px; font-size: 24px; font-weight: 700; font-style: italic; color: #F4F1E8; }
    .val { display: flex; align-items: baseline; gap: 3px; font-weight: 700; font-size: 26px; line-height: 1; color: #F4F1E8; }
    .val small { font-size: 13px; color: #9fb0c4; font-weight: 600; }
    .val.mp { color: #7FC6E8; }
    .bar { position: relative; width: 120px; height: 8px; background: #2a3246; margin-left: auto; }
    .bar i { position: absolute; inset: 0 auto 0 0; display: block; background: #E3B94A; }
    .corner { position: absolute; width: 30px; height: 30px; border: 0 solid #E3B94A; filter: drop-shadow(0 0 4px rgba(227, 185, 74, 0.6)); }
  </style>
</helmet>
<div class="frame">
  <img src="bg-gagazet.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; object-fit: cover; filter: saturate(0.92) contrast(1.06);">
  <div style="position: absolute; inset: 0; background: radial-gradient(120% 90% at 55% 40%, rgba(11, 10, 18, 0) 45%, rgba(11, 10, 18, 0.55) 100%), linear-gradient(180deg, rgba(11, 10, 18, 0.35) 0%, rgba(11, 10, 18, 0) 22%, rgba(11, 10, 18, 0) 68%, rgba(11, 10, 18, 0.62) 100%);"></div>

  <img src="char-yuna.webp" alt="" style="position: absolute; left: 292px; top: 342px; height: 300px; filter: brightness(0.82);">
  <img src="char-tidus-attack.webp" alt="" style="position: absolute; left: 468px; top: 274px; height: 386px; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.5));">
  <img src="char-seymour.webp" alt="" style="position: absolute; left: 912px; top: 168px; height: 540px; filter: drop-shadow(0 0 28px rgba(200, 120, 255, 0.35));">

  <svg style="position: absolute; inset: 0; width: 1440px; height: 810px; opacity: 0.13; mix-blend-mode: overlay; pointer-events: none;" xmlns="http://www.w3.org/2000/svg"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

  <div style="position: absolute; left: 892px; top: 150px; width: 470px; height: 560px;">
    <div class="corner" style="left: 0; top: 0; border-left-width: 3px; border-top-width: 3px;"></div>
    <div class="corner" style="right: 0; top: 0; border-right-width: 3px; border-top-width: 3px;"></div>
    <div class="corner" style="left: 0; bottom: 0; border-left-width: 3px; border-bottom-width: 3px;"></div>
    <div class="corner" style="right: 0; bottom: 0; border-right-width: 3px; border-bottom-width: 3px;"></div>
    <div style="position: absolute; left: -18px; top: 118px; transform: skewX(-12deg); padding: 7px 20px 8px; background: #0B0A12; border-left: 4px solid #E3B94A; white-space: nowrap;">
      <span class="serif" style="display: inline-block; transform: skewX(12deg); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; color: #F4F1E8;">SEYMOUR FLUX</span>
    </div>
  </div>

  <div style="position: absolute; left: 940px; top: 96px;">
    <svg width="380" height="190" viewBox="0 0 380 190" style="position: absolute; left: -46px; top: -34px;" xmlns="http://www.w3.org/2000/svg"><path d="M18 96 L58 34 L142 54 L206 8 L266 62 L352 42 L326 112 L364 166 L252 146 L182 182 L118 136 L36 158 Z" fill="#E3B94A" opacity="0.94"></path></svg>
    <div class="serif" style="position: relative; font-size: 128px; font-weight: 700; font-style: italic; color: #0B0A12; line-height: 1; letter-spacing: -0.02em;">1268</div>
  </div>

  <div style="position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 18px; padding: 10px 34px 12px 28px; background: #F4F1E8; border-bottom: 4px solid #E3B94A; transform: skewX(-12deg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
    <div class="serif" style="transform: skewX(12deg); font-size: 46px; font-weight: 700; font-style: italic; color: #0B0A12; line-height: 1;">Tidus</div>
    <div style="transform: skewX(12deg); padding: 7px 12px; background: #0B0A12; color: #E3B94A; font-weight: 700; font-size: 14px; letter-spacing: 0.26em;">ATTACK</div>
  </div>

  <div style="position: absolute; left: 68px; bottom: 58px; display: flex; flex-direction: column; gap: 8px;">
    <div class="cmd sel" style="margin-left: 0;"><svg width="12" height="16" viewBox="0 0 12 16" style="transform: skewX(12deg);" xmlns="http://www.w3.org/2000/svg"><path d="M1 1 L11 8 L1 15 Z" fill="#0B0A12"></path></svg><span>Attack</span></div>
    <div class="cmd" style="margin-left: 16px;"><span>Skills</span></div>
    <div class="cmd" style="margin-left: 32px;"><span>Magic</span><span class="num" style="margin-left: auto; font-size: 20px; color: #3C79AE;">8</span></div>
    <div class="cmd" style="margin-left: 48px;"><span>Items</span></div>
    <div class="cmd" style="margin-left: 64px; background: #0B0A12; color: #E3B94A; border: 2px solid #E3B94A;"><span>Overdrive</span><span style="margin-left: auto; font-size: 11px; letter-spacing: 0.2em; color: #F4F1E8;">READY</span></div>
  </div>

  <div style="position: absolute; right: 44px; top: 112px; display: flex; flex-direction: column; align-items: flex-end; gap: 9px;">
    <div class="ctb" style="transform: translateX(0);"><b>TIDUS</b><div class="tile now"><img src="portrait-tidus.webp" alt=""></div></div>
    <div class="ctb" style="transform: translateX(-8px);"><b style="color: #d98a8a;">SEYMOUR</b><div class="tile enemy"><div class="mono">S</div><span class="tag">A</span></div></div>
    <div class="ctb" style="transform: translateX(-16px);"><b>YUNA</b><div class="tile"><img src="portrait-yuna.webp" alt=""></div></div>
    <div class="ctb" style="transform: translateX(-24px);"><b style="color: #d98a8a;">MORTIORCHIS</b><div class="tile enemy"><div class="mono">M</div><span class="tag">B</span></div></div>
    <div class="ctb" style="transform: translateX(-32px);"><b>AURON</b><div class="tile"><div class="mono">A</div></div></div>
    <div class="ctb" style="transform: translateX(-40px); opacity: 0.8;"><b>TIDUS</b><div class="tile"><img src="portrait-tidus.webp" alt=""></div></div>
  </div>

  <div style="position: absolute; right: 52px; bottom: 54px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
    <div class="stat acting" style="margin-right: 0;">
      <div class="face"><img src="portrait-tidus.webp" alt=""></div>
      <div class="name serif" style="color: #E3B94A;">Tidus</div>
      <div class="val num">2419<small>/2600</small></div>
      <div class="val num mp">68<small>/92</small></div>
      <div class="bar"><i style="width: 100%;"></i></div>
    </div>
    <div class="stat" style="margin-right: 16px;">
      <div class="face"><img src="portrait-yuna.webp" alt=""></div>
      <div class="name serif">Yuna</div>
      <div class="val num">1782<small>/1900</small></div>
      <div class="val num mp">240<small>/312</small></div>
      <div class="bar"><i style="width: 58%;"></i></div>
    </div>
    <div class="stat" style="margin-right: 32px;">
      <div class="face"><div class="mono" style="position: static; height: 62px;">A</div></div>
      <div class="name serif">Auron</div>
      <div class="val num">3080<small>/3080</small></div>
      <div class="val num mp">34<small>/60</small></div>
      <div class="bar"><i style="width: 24%;"></i></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

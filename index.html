<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Pyrefly Reprise - an unofficial HD-2D fan tribute to Final Fantasy X and X-2." />
    <title>Pyrefly Reprise</title>
    <style>
      /* ---- font stack ------------------------------------------------------
         Real OFL webfonts are dropped in later by the assets agent; they will
         register the families "Pyrefly Display" and "Pyrefly Text" via @font-face.
         Until then these fall through to the system stack below.            */
      :root {
        --font-display: 'Pyrefly Display', 'Cinzel', 'Trajan Pro', 'Iowan Old Style',
          'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
        --font-text: 'Pyrefly Text', 'Inter', 'Segoe UI Variable Text', 'Segoe UI',
          system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'Cascadia Mono', 'Consolas', ui-monospace, SFMono-Regular, Menlo, monospace;

        --ink: #eaf2ff;
        --ink-dim: #9fb3cf;
        --accent: #7fe3d0;
        --bg: #04060b;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        touch-action: none;
      }

      #app {
        position: fixed;
        inset: 0;
        display: block;
        background: var(--bg);
      }

      /* Three.js canvas lives here; the renderer appends its <canvas>. */
      #game {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #game > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* DOM overlay: menus, HUD, dialogue, damage numbers. */
      #ui {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        /* children opt back in with pointer-events: auto */
      }
      #ui [data-action],
      #ui button,
      #ui .ui-interactive {
        pointer-events: auto;
        cursor: pointer;
      }

      /* Full-screen fade / flash layer used between screens. */
      #fade {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        opacity: 1;
        pointer-events: none;
        transition: opacity 450ms ease;
      }
      #fade[data-state='clear'] {
        opacity: 0;
      }

      /* Boot message, replaced by the first screen. */
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 13px;
        color: var(--ink-dim);
      }

      @media (prefers-reduced-motion: reduce) {
        #fade { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="ui" aria-live="polite"></div>
      <div id="fade" data-state="opaque"></div>
      <div id="boot">Loading</div>
    </div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Pyrefly Reprise needs JavaScript and WebGL 2.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
